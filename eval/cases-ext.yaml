- id: A41
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, may providers of high-risk AI systems covered by Union harmonisation legislation listed in Section A of
    Annex I conduct testing in real world conditions outside AI regulatory sandboxes under Article 60 of the EU AI Act? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    articles:
      - art_60
    claim: yes
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(24)(a) (amended Art. 60(1))
    quote: may be conducted by providers or prospective providers of high-risk AI systems listed in Annex III or covered by Union harmonisation
      legislation listed in Section A of Annex I
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. 32024R1689 Art. 60(1) covered only Annex III systems and left
