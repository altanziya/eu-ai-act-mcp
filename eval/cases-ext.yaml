- id: A40
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, is each administrative fine for a small mid-cap enterprise (SMC) under Article 99(4) and (5) of the EU AI
    Act capped at the lower of the percentage and the fixed amount, rather than the higher? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    articles:
      - art_99
    claim: yes
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(38)(c) (new Art. 99(6a))
    quote: In the case of SMCs, each fine referred to in paragraphs 4 and 5 shall be up to the percentages or amount referred therein, whichever
      is lower.
  legal_review: llm_second_rater
