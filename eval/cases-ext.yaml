- id: A35
  kind: generation
  subset: version_deadline
  question: From what date does Article 101 of the EU AI Act (fines for providers of general-purpose AI models) apply?
  as_of: 2026-10-05
  knowable_before_omnibus: true
  origin: constructed
  origin_ref: "https://news.ycombinator.com/item?id=49505351 (Thema: erste Kommissions-Auskunftsersuchen an Modellanbieter, Bericht 06,
    Abschnitt Marktüberwachung; Frage selbst abgeleitet)"
  expected:
    date: 2026-08-02
    articles:
      - art_101
      - art_113
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 113, second paragraph and third paragraph, point (b)
    quote: "It shall apply from 2 August 2026. However: (a) Chapters I and II shall apply from 2 February 2025; (b) Chapter III Section 4,
      Chapter V, Chapter VII and Chapter XII and Article 78 shall apply from 2 August 2025, with the exception of Article 101"
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Art. 101 is in Chapter XII but is expressly excepted from the 2
    August 2025 date in Art. 113(3)(b), so the general date 2 August 2026 applies; point (b) is unchanged by the Omnibus. A model that
    applies the GPAI date 2 August 2025 to all of Chapter XII would err. Topical origin only: the HN thread is about the first Commission
    information requests to model providers, not this exact question. Reworded before freezing: the draft asked about a model placed on the market in 2025, which the blind
    second rater flagged as ambiguous because of the Art. 111(3) transition."
- id: A36
  kind: generation
  subset: version_deadline
  question: A company takes a general-purpose AI system that is already on the EU market and changes its intended purpose so that the system
    becomes a high-risk AI system under Article 6 of the EU AI Act. Is that company considered a provider of the high-risk AI system under
    Article 25(1)? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: true
  origin: constructed
  origin_ref: https://www.youtube.com/watch?v=b4ZfSiVx3JU (IfR Talk 04, 2024-07-16; Bericht 07, Entwicklerfragen Nr. 9; Frage abgeleitet)
  expected:
    articles:
      - art_25
    claim: yes
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 25(1)(c)
    quote: they modify the intended purpose of an AI system, including a general-purpose AI system, which has not been classified as high-risk
      and has already been placed on the market or put into service in such a way that the AI system concerned becomes a high-risk AI system
      in accordance with Article 6
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Art. 25(1) is not amended by the Omnibus (only paragraphs 2 and
    4). Class restricted to a third party that is not the initial provider and modifies the intended purpose of an AI system not classified
    as high-risk. Origin is a thematic match (IfR Talk 04 states that a party who changes the purpose becomes manufacturer/provider), not a
    verbatim user question."
