  question: As of 10 January 2026, by what date must the European Commission provide guidelines, including a comprehensive list of practical
    examples of high-risk and not high-risk use cases, specifying the practical implementation of Article 6 of the EU AI Act?
  as_of: 2026-01-10
  knowable_before_omnibus: true
  origin: constructed
  expected:
    date: 2026-02-02
    articles:
      - art_6
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 6(5)
    quote: no later than 2 February 2026, provide guidelines specifying the practical implementation of this Article in line with Article 96
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 32024R1689. Art. 6(5) is unchanged in 32026R1744 (the Omnibus only excepts Art. 6(5)
    from the new application dates in Art. 113(3)(c)); the statutory date stays 2 February 2026. A model that conflates the guideline
    deadline with the delayed high-risk application dates (2027/2028) may err."
