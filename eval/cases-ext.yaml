- id: A42
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, which article of the EU AI Act allows Member States to permit testing of high-risk AI systems in real world
    conditions outside AI regulatory sandboxes for AI-enabled products covered by Union harmonisation legislation listed in Section B of
    Annex I? Give the article number.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    articles:
      - art_60a
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(25) (new Art. 60a(1))
    quote: Member States may allow, in accordance with this Article, the testing of high-risk AI systems in real world conditions outside AI
      regulatory sandboxes by providers or prospective providers of AI enabled products covered by the Union harmonisation legislation
      listed in Section B of Annex I
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Article 60a is new. Answer: Article 60a (not Article 60)."
