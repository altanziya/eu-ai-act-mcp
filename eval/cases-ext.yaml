- id: A44
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, are high-risk AI systems that fall within the scope of the Cyber Resilience Act (Regulation (EU) 2024/2847)
    and fulfil the conditions of Article 12(1) of that Regulation deemed to comply with the cybersecurity requirements of Article 15 of the
    EU AI Act? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  origin_ref: https://www.youtube.com/watch?v=JFmkK3S3gDM (CoreLogic Defense, 2026-09-29, 'which framework actually takes priority?'; Bericht
    07, Entwicklerfragen Nr. 8; Frage abgeleitet)
  expected:
    articles:
      - art_42
    claim: yes
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(18) (new Art. 42(3))
    quote: Where high-risk AI systems fall within the scope of Regulation (EU) 2024/2847 and the conditions laid down in Article 12(1) of that
      Regulation are fulfilled, such systems shall be deemed to comply with the cybersecurity requirements set out in Article 15 of this
      Regulation.
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Art. 42(3) is new; 32024R1689 Art. 42(2) knew only the presumption
    via a cybersecurity scheme under Regulation (EU) 2019/881. Topical origin only: the video asks which framework takes priority (CRA, AI
    Act, NIS 2, DORA), not this exact question."
