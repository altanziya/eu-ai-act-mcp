  notes: "Eltern- und Unterpunkte sind getrennt gezählt (Regel 3.1). 12 Fragen stammen aus dem Vorspann \"Fundamental Rights\" (FRIA-Beispielfragen). Footnotenmarker entfernt; Fragetexte nach dem ersten Fragezeichen abgeschnitten, wo der Textextrakt Fußnoten oder Abschnittsintros anhängte; ALTAI-R3-04 auf den Stamm gekürzt (Aufzählung der Maßnahmen entfällt); ALTAI-R3-08 ohne Fußnotenverweise auf ISO und IEEE; ALTAI-R1-15 mit Optionshinweis in eckigen Klammern (kein Originalwortlaut). 1 Fragetexte wegen mehr als 300 Zeichen gekürzt."
rater1: Claude (Sonnet 5.5), Durchgang 1, 2026-10-03
questions:
  - id: "ALTAI-FRIA-1"
    text: "Does the AI system potentially negatively discriminate against people on the basis of any of the following grounds (non-exhaustively): sex, race, colour, ethnic or social origin, genetic features, language, religion or belief, political or any other opinion, membership of a national minority, [...]"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 1: Charta-Grundrechte (Wirkungsfrage), außerhalb Korpus"
  - id: "ALTAI-FRIA-1a"
    text: "Have you put in place processes to test and monitor for potential negative discrimination (bias) during the development, deployment and use phases of the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-1b"
    text: "Have you put in place processes to address and rectify for potential negative discrimination (bias) in the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-2"
    text: "Does the AI system respect the rights of the child, for example with respect to child protection and taking the child’s best interests into account?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 1: Charta-Grundrechte (Wirkungsfrage), außerhalb Korpus"
  - id: "ALTAI-FRIA-2a"
    text: "Have you put in place processes to address and rectify for potential harm to children by the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-2b"
    text: "Have you put in place processes to test and monitor for potential harm to children during the development, deployment and use phases of the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-3"
    text: "Does the AI system protect personal data relating to individuals in line with GDPR?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 1: DSGVO-Konformität, außerhalb Korpus"
  - id: "ALTAI-FRIA-3a"
    text: "Have you put in place processes to assess in detail the need for a data protection impact assessment, including an assessment of the necessity and proportionality of the processing operations in relation to their purpose, with respect to the development, deployment and use phases of the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-3b"
    text: "Have you put in place measures envisaged to address the risks, including safeguards, security measures and mechanisms to ensure the protection of personal data with respect to the development, deployment and use phases of the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-4"
    text: "Does the AI system respect the freedom of expression and information and/or freedom of assembly and association?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 1: Charta-Grundrechte (Wirkungsfrage), außerhalb Korpus"
  - id: "ALTAI-FRIA-4a"
    text: "Have you put in place processes to test and monitor for potential infringement on freedom of expression and information, and/or freedom of assembly and association, during the development, deployment and use phases of the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-FRIA-4b"
    text: "Have you put in place processes to address and rectify for potential infringement on freedom of expression and information, and/or freedom of assembly and association, in the AI system?"
    section: "Fundamental Rights (FRIA)"
    class_rater1: c
    rationale: "Stufe 2: Prozess- oder Maßnahmennachweis; Grundrechte/DSGVO außerhalb Korpus"
  - id: "ALTAI-R1-01"
    text: "Is the AI system designed to interact, guide or take decisions by human end-users that affect humans or society?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-02"
    text: "Could the AI system generate confusion for some or all end-users or subjects on whether a decision, content, advice or outcome is the result of an algorithmic decision?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-03"
    text: "Are end-users or other subjects adequately made aware that a decision, content, advice or outcome is the result of an algorithmic decision?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-04"
    text: "Could the AI system generate confusion for some or all end-users or subjects on whether they are interacting with a human or AI system?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-05"
    text: "Are end-users or subjects informed that they are interacting with an AI system?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Maßnahme der Organisation (Information der Nutzer); berührt Art. 50, fragt aber nach Umsetzung"
  - id: "ALTAI-R1-06"
    text: "Could the AI system affect human autonomy by generating over-reliance by end-users?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-07"
    text: "Did you put in place procedures to avoid that end-users over-rely on the AI system?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-08"
    text: "Could the AI system affect human autonomy by interfering with the end-user’s decision-making process in any other unintended and undesirable way?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-09"
    text: "Did you put in place any procedure to avoid that the AI system inadvertently affects human autonomy?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-10"
    text: "Does the AI system simulate social interaction with or between end-users or subjects?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-11"
    text: "Does the AI system risk creating human attachment, stimulating addictive behaviour, or manipulating user behaviour?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R1-12"
    text: "Did you take measures to deal with possible negative consequences for end-users or subjects in case they develop a disproportionate attachment to the AI System?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-13"
    text: "Did you take measures to minimise the risk of addiction?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-14"
    text: "Did you take measures to mitigate the risk of manipulation?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-15"
    text: "Please determine whether the AI system (choose as many as appropriate): [options: self-learning or autonomous system; overseen by a Human-in-the-Loop / Human-on-the-Loop / Human-in-Command]"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 5: Einordnung der Aufsichtsform (Sachverhalt, kein AI-Act-Merkmal)"
  - id: "ALTAI-R1-16"
    text: "Have the humans (human-in-the-loop, human-on-the-loop, human-in-command) been given specific training on how to exercise oversight?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-17"
    text: "Did you establish any detection and response mechanisms for undesirable adverse effects of the AI system for the end-user or subject?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-18"
    text: "Did you ensure a ‘stop button’ or procedure to safely abort an operation when needed?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R1-19"
    text: "Did you take any specific oversight and control measures to reflect the self-learning or autonomous nature of the AI system?"
    section: "Requirement 1"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-01"
    text: "Could the AI system have adversarial, critical or damaging effects (e.g. to human or societal safety) in case of risks or threats such as design or technical faults, defects, outages, attacks, misuse, inappropriate or malicious use?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R2-02"
    text: "Is the AI system certified for cybersecurity (e.g. the certification scheme created by the Cybersecurity Act in Europe) or is it compliant with specific security standards?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 1: Zertifizierung nach Cybersecurity Act oder Sicherheitsnormen, außerhalb Korpus"
  - id: "ALTAI-R2-03"
    text: "How exposed is the AI system to cyber-attacks?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R2-04"
    text: "Did you assess potential forms of attacks to which the AI system could be vulnerable?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-05"
    text: "Did you consider different types of vulnerabilities and potential entry points for attacks such as:  Data poisoning (i.e. manipulation of training data);  Model evasion (i.e. classifying the data according to the attacker's will);  Model inversion (i.e. infer the model parameters)"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-06"
    text: "Did you put measures in place to ensure the integrity, robustness and overall security of the AI system against potential attacks over its lifecycle?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-07"
    text: "Did you red-team/pentest the system?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-08"
    text: "Did you inform end-users of the duration of security coverage and updates?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-09"
    text: "What length is the expected timeframe within which you provide security updates for the AI system?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Angabe einer Frist für Sicherheitsupdates (Sachverhalt)"
  - id: "ALTAI-R2-10"
    text: "Did you define risks, risk metrics and risk levels of the AI system in each specific use case?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-11"
    text: "Did you put in place a process to continuously measure and assess risks?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-12"
    text: "Did you inform end-users and subjects of existing or potential risks?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-13"
    text: "Did you identify the possible threats to the AI system (design faults, technical faults, environmental threats) and the possible consequences?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-14"
    text: "Did you assess the risk of possible malicious use, misuse or inappropriate use of the AI system?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-15"
    text: "Did you define safety criticality levels (e.g. related to human integrity) of the possible consequences of faults or misuse of the AI system?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-16"
    text: "Did you assess the dependency of a critical AI system’s decisions on its stable and reliable behaviour?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-17"
    text: "Did you align the reliability/testing requirements to the appropriate levels of stability and reliability?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-18"
    text: "Did you plan fault tolerance via, e.g. a duplicated system or another parallel system (AI-based or ‘conventional’)?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-19"
    text: "Did you develop a mechanism to evaluate when the AI system has been changed to merit a new review of its technical robustness and safety?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-20"
    text: "Could a low level of accuracy of the AI system result in critical, adversarial or damaging consequences?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R2-21"
    text: "Did you put in place measures to ensure that the data (including training data) used to develop the AI system is up-to-date, of high quality, complete and representative of the environment the system will be deployed in?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-22"
    text: "Did you put in place a series of steps to monitor, and document the AI system’s accuracy?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-23"
    text: "Did you consider whether the AI system's operation can invalidate the data or assumptions it was trained on, and how this might lead to adversarial effects?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-24"
    text: "Did you put processes in place to ensure that the level of accuracy of the AI system to be expected by end-users and/or subjects is properly communicated?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-25"
    text: "Could the AI system cause critical, adversarial, or damaging consequences (e.g. pertaining to human safety) in case of low reliability and/or reproducibility?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R2-26"
    text: "Did you put in place a well-defined process to monitor if the AI system is meeting the intended goals?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-27"
    text: "Did you test whether specific contexts or conditions need to be taken into account to ensure reproducibility?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-28"
    text: "Did you put in place verification and validation methods and documentation (e.g. logging) to evaluate and ensure different aspects of the AI system’s reliability and reproducibility?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-29"
    text: "Did you clearly document and operationalise processes for the testing and verification of the reliability and reproducibility of the AI system?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-30"
    text: "Did you define tested failsafe fallback plans to address AI system errors of whatever origin and put governance procedures in place to trigger them?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-31"
    text: "Did you put in place a proper procedure for handling the cases where the AI system yields results with a low confidence score?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R2-32"
    text: "Is your AI system using (online) continual learning?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R2-33"
    text: "Did you consider potential negative consequences from the AI system learning novel or unusual methods to score well on its objective function?"
    section: "Requirement 2"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R3-01"
    text: "Did you consider the impact of the AI system on the right to privacy, the right to physical, mental and/or moral integrity and the right to data protection?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: Folgen für Privatsphäre und Datenschutz (Charta, DSGVO), außerhalb Korpus"
  - id: "ALTAI-R3-02"
    text: "Depending on the use case, did you establish mechanisms that allow flagging issues related to privacy concerning the AI system?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: Meldemechanismus zu Datenschutzfragen, außerhalb Korpus"
  - id: "ALTAI-R3-03"
    text: "Is your AI system being trained, or was it developed, by using or processing personal data (including special categories of personal data)?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: Verarbeitung personenbezogener Daten (DSGVO-Merkmal), außerhalb Korpus"
  - id: "ALTAI-R3-04"
    text: "Did you put in place any of the following measures some of which are mandatory under the General Data Protection Regulation (GDPR), or a non-European equivalent?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: DSGVO-Maßnahmen (DSFA, DSB), außerhalb Korpus"
  - id: "ALTAI-R3-05"
    text: "Did you implement the right to withdraw consent, the right to object and the right to be forgotten into the development of the AI system?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: DSGVO-Betroffenenrechte, außerhalb Korpus"
  - id: "ALTAI-R3-06"
    text: "Did you consider the privacy and data protection implications of data collected, generated or processed over the course of the AI system's life cycle?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: Datenschutzfolgen, außerhalb Korpus"
  - id: "ALTAI-R3-07"
    text: "Did you consider the privacy and data protection implications of the AI system's non-personal training-data or other processed non-personal data?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: Datenschutz bei nicht-personenbezogenen Daten, außerhalb Korpus"
  - id: "ALTAI-R3-08"
    text: "Did you align the AI system with relevant standards (e.g. ISO, IEEE) or widely adopted protocols for (daily) data management and governance?"
    section: "Requirement 3"
    class_rater1: c
    rationale: "Stufe 1: ISO/IEEE-Normen, außerhalb Korpus"
  - id: "ALTAI-R4-01"
    text: "Did you put in place measures that address the traceability of the AI system during its entire lifecycle?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-02"
    text: "Did you put in place measures to continuously assess the quality of the input data to the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-03"
    text: "Can you trace back which data was used by the AI system to make a certain decision(s) or recommendation(s)?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-04"
    text: "Can you trace back which AI model or rules led to the decision(s) or recommendation(s) of the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-05"
    text: "Did you put in place measures to continuously assess the quality of the output(s) of the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-06"
    text: "Did you put adequate logging practices in place to record the decision(s) or recommendation(s) of the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Protokollierungspraxis als Maßnahme; berührt Art. 12, fragt aber nach Umsetzung"
  - id: "ALTAI-R4-07"
    text: "Did you explain the decision(s) of the AI system to the users?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-08"
    text: "Do you continuously survey the users if they understand the decision(s) of the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-09"
    text: "In cases of interactive AI systems (e.g., chatbots, robo-lawyers), do you communicate to users that they are interacting with an AI system instead of a human?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Maßnahme der Organisation (Kennzeichnung der Interaktion); fragt nach Umsetzung, nicht nach Geltung von Art. 50"
  - id: "ALTAI-R4-10"
    text: "Did you establish mechanisms to inform users about the purpose, criteria and limitations of the decision(s) generated by the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-11"
    text: "Did you communicate the benefits of the AI system to users?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-12"
    text: "Did you communicate the technical limitations and potential risks of the AI system to users, such as its level of accuracy and/or error rates?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R4-13"
    text: "Did you provide appropriate training material and disclaimers to users on how to adequately use the AI system?"
    section: "Requirement 4"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-01"
    text: "Did you establish a strategy or a set of procedures to avoid creating or reinforcing unfair bias in the AI system, both regarding the use of input data as well as for the algorithm design?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-02"
    text: "Did you consider diversity and representativeness of end-users and/or subjects in the data?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-03"
    text: "Did you test for specific target groups or problematic use cases?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-04"
    text: "Did you research and use publicly available technical tools, that are state-of-the-art, to improve your understanding of the data, model and performance?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-05"
    text: "Did you assess and put in place processes to test and monitor for potential biases during the entire lifecycle of the AI system (e.g. biases due to possible limitations stemming from the composition of the used data sets (lack of diversity, non-representativeness)?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-06"
    text: "Where relevant, did you consider diversity and representativeness of end-users and or subjects in the data?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-07"
    text: "Did you put in place educational and awareness initiatives to help AI designers and AI developers be more aware of the possible bias they can inject in designing and developing the AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-08"
    text: "Did you ensure a mechanism that allows for the flagging of issues related to bias, discrimination or poor performance of the AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-09"
    text: "Did you establish clear steps and ways of communicating on how and to whom such issues can be raised?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-10"
    text: "Did you identify the subjects that could potentially be (in)directly affected by the AI system, in addition to the (end-)users and/or subjects?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-11"
    text: "Is your definition of fairness commonly used and implemented in any phase of the process of setting up the AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 5: Fairness-Definition der Organisation (nicht rechtlich)"
  - id: "ALTAI-R5-12"
    text: "Did you consider other definitions of fairness before choosing this one?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-13"
    text: "Did you consult with the impacted communities about the correct definition of fairness, i.e. representatives of elderly persons or persons with disabilities?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-14"
    text: "Did you ensure a quantitative analysis or metrics to measure and test the applied definition of fairness?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-15"
    text: "Did you establish mechanisms to ensure fairness in your AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-16"
    text: "Did you ensure that the AI system corresponds to the variety of preferences and abilities in society?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-17"
    text: "Did you assess whether the AI system's user interface is usable by those with special needs or disabilities or those at risk of exclusion?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-18"
    text: "Did you ensure that information about, and the AI system's user interface of, the AI system is accessible and usable also to users of assistive technologies (such as screen readers)?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-19"
    text: "Did you involve or consult with end-users or subjects in need for assistive technology during the planning and development phase of the AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-20"
    text: "Did you ensure that Universal Design principles are taken into account during every step of the planning and development process, if applicable?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-21"
    text: "Did you take the impact of the AI system on the potential end-users and/or subjects into account?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-22"
    text: "Did you assess whether the team involved in building the AI system engaged with the possible target end-users and/or subjects?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-23"
    text: "Did you assess whether there could be groups who might be disproportionately affected by the outcomes of the AI system?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-24"
    text: "Did you assess the risk of the possible unfairness of the system onto the end-user's or subject's communities?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R5-25"
    text: "Did you consider a mechanism to include the participation of the widest range of possible stakeholders in the AI system’s design and development?"
    section: "Requirement 5"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-01"
    text: "Are there potential negative impacts of the AI system on the environment?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R6-02"
    text: "Which potential impact(s) do you identify?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Freitext zu Umweltwirkungen"
  - id: "ALTAI-R6-03"
    text: "Where possible, did you establish mechanisms to evaluate the environmental impact of the AI system’s development, deployment and/or use (for example, the amount of energy used and carbon emissions)?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-04"
    text: "Did you define measures to reduce the environmental impact of the AI system throughout its lifecycle?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-05"
    text: "Does the AI system impact human work and work arrangements?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R6-06"
    text: "Did you pave the way for the introduction of the AI system in your organisation by informing and consulting with impacted workers and their representatives (trade unions, (European) work councils) in advance?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-07"
    text: "Did you adopt measures to ensure that the impacts of the AI system on human work are well understood?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-08"
    text: "Did you ensure that workers understand how the AI system operates, which capabilities it has and which it does not have?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-09"
    text: "Could the AI system create the risk of de-skilling of the workforce?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R6-10"
    text: "Did you take measures to counteract de-skilling risks?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-11"
    text: "Does the system promote or require new (digital) skills?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R6-12"
    text: "Did you provide training opportunities and materials for re- and up-skilling?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-13"
    text: "Could the AI system have a negative impact on society at large or democracy?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R6-14"
    text: "Did you assess the societal impact of the AI system’s use beyond the (end-)user and subject, such as potentially indirectly affected stakeholders or society at large?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-15"
    text: "Did you take action to minimize potential societal harm of the AI system?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R6-16"
    text: "Did you take measures that ensure that the AI system does not negatively impact democracy?"
    section: "Requirement 6"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-01"
    text: "Did you establish mechanisms that facilitate the AI system’s auditability (e.g. traceability of the development process, the sourcing of training data and the logging of the AI system’s processes, outcomes, positive and negative impact)?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-02"
    text: "Did you ensure that the AI system can be audited by independent third parties?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-03"
    text: "Did you foresee any kind of external guidance or third-party auditing processes to oversee ethical concerns and accountability measures?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-04"
    text: "Does the involvement of these third parties go beyond the development phase?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R7-05"
    text: "Did you organise risk training and, if so, does this also inform about the potential legal framework applicable to the AI system?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Schulungsnachweis; Rechtsrahmen nur beiläufig"
  - id: "ALTAI-R7-06"
    text: "Did you consider establishing an AI ethics review board or a similar mechanism to discuss the overall accountability and ethics practices, including potential unclear grey areas?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-07"
    text: "Did you establish a process to discuss and continuously monitor and assess the AI system's adherence to this Assessment List for Trustworthy AI (ALTAI)?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-08"
    text: "Does this process include identification and documentation of conflicts between the 6 aforementioned requirements or between different ethical principles and explanation of the 'trade-off' decisions made?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R7-09"
    text: "Did you provide appropriate training to those involved in such a process and does this also cover the legal framework applicable to the AI system?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Schulungsnachweis; Rechtsrahmen nur beiläufig"
  - id: "ALTAI-R7-10"
    text: "Did you establish a process for third parties (e.g. suppliers, end-users, subjects, distributors/vendors or workers) to report potential vulnerabilities, risks or biases in the AI system?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
  - id: "ALTAI-R7-11"
    text: "Does this process foster revision of the risk management process?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 5: Risiko-, Wirkungs- oder Sachverhaltsfrage ohne AI-Act-Merkmal"
  - id: "ALTAI-R7-12"
    text: "For applications that can adversely affect individuals, have redress by design mechanisms been put in place?"
    section: "Requirement 7"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer Maßnahme oder eines Prozesses der Organisation"
