questions:
  - id: "CAIQ-A&A-01.1"
    text: "Are audit and assurance policies, procedures, and standards established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-A&A-01.2"
    text: "Are audit and assurance policies, procedures, and standards reviewed and updated at least annually or upon significant changes?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-A&A-02.1"
    text: "Are independent audit and assurance assessments conducted according to relevant standards at least annually?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-A&A-03.1"
    text: "Are independent audit and assurance assessments performed according to risk-based plans and policies, and in response to significant changes or emerging risks?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-A&A-04.1"
    text: "Is compliance verified with all relevant standards, regulations, legal/contractual, and statutory requirements applicable to the audit?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-A&A-05.1"
    text: "Are Audit Management processes aligned with relevant auditing standards, defined and implemented to support audit planning, risk analysis, security control assessment, conclusion, remediation schedules, report generation, review of past reports and supporting evidence?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-A&A-06.1"
    text: "Is a risk-based corrective action plan established, documented, approved, communicated, applied, evaluated, and maintained to remediate audit findings, regularly review, and report remediation status to relevant stakeholders?"
    section: "Audit & Assurance"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-01.1"
    text: "Are policies and procedures for application security established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-AIS-01.2"
    text: "Are the policies and procedures for application security reviewed and updated at least annually, or upon significant system changes?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-AIS-02.1"
    text: "Are baseline requirements for securing applications established, documented, and maintained?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-03.1"
    text: "Are technical and operational metrics defined and implemented in alignment with business objectives, security requirements, and compliance obligations?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-04.1"
    text: "Is a secure SDLC process for application requirements analysis, planning, design, development, testing, deployment, and operation, defined and implemented in accordance with security requirements?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-05.1"
    text: "Is a testing strategy implemented, including criteria for acceptance of new information systems, upgrades, and new versions, to provide application security assurance, maintain compliance, and meet organizational delivery goals?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-05.2"
    text: "Is automation applied where applicable and possible?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-06.1"
    text: "Are strategies and capabilities established and implemented for secure, standardized, and compliant application deployment?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-07.1"
    text: "Are processes defined and implemented to remediate application security vulnerabilities, automating remediation when possible?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-08.1"
    text: "Are processes, procedures and technical measures to secure APIs, including authorization flaws, API key management, regular security testing, defined, implemented and evaluated?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-08.2"
    text: "Are technical measures for any improvements reviewed and updated at least annually or after significant system changes?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-AIS-09.1"
    text: "Is the input against adversarial patterns, failure patterns and unwanted behaviour, validated, filtered, modified, or blocked as necessary, according to organizational policies, applicable laws and regulations?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-AIS-10.1"
    text: "Is the output against adversarial patterns, failure patterns and unwanted behaviour, validated, filtered, modified, or blocked as necessary, according to organizational policies, applicable laws and regulations?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-AIS-11.1"
    text: "Are the security boundaries for agents established?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-12.1"
    text: "Are source code management practices, such as version control, code review and static code analysis, implemented and aligning with the SDLC process?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-13.1"
    text: "Are sandboxing techniques implemented to execute AI tools and plugins in isolated environments to prevent unintended interactions with critical systems or data and to limit the possibility of lateral movement?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-14.1"
    text: "Are security measures implemented to protect cache systems in GenAI systems and services?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-AIS-15.1"
    text: "Are mechanisms implemented to enable the model to clearly distinguish user-provided input instructions from data and system instructions (e.g., system prompts)?"
    section: "Application & Interface Security"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-01.1"
    text: "Are business continuity management and operational resilience policies and procedures established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-BCR-01.2"
    text: "Are policies and procedures reviewed and updated at least annually, or upon significant changes?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-BCR-02.1"
    text: "Is the impact of business disruptions and risks determined to establish criteria for developing business continuity and operational resilience strategies and capabilities?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-02.2"
    text: "Is the risk assessment and impact analysis, reviewed and updated at least annually or upon significant changes?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-BCR-03.1"
    text: "Are strategies established to reduce the impact of business disruptions, and improve resiliency and recovery from business disruptions?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-04.1"
    text: "Is a business continuity plan - based on the results of operational resilience strategies and capabilities - established, documented, approved, communicated, applied, evaluated and maintained?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-05.1"
    text: "Is relevant documentation, both internal and from external parties, for supporting the business continuity and operational resilience plans, developed, identified, and acquired?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-05.2"
    text: "Is the documentation available to authorized stakeholders and reviewed at least annually, or upon significant changes?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-BCR-06.1"
    text: "Are the business continuity and operational resilience plans exercised and tested at least annually, or upon significant changes?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-BCR-07.1"
    text: "Are communication channels with all relevant stakeholders established and maintained in the course of business continuity and resilience procedures?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-08.1"
    text: "Are backups periodically performed?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-08.2"
    text: "Is the confidentiality, integrity and availability of the backup, ensured and data restoration from backup verified for resiliency?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-09.1"
    text: "Is a disaster response plan to recover from natural and man-made disasters established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-09.2"
    text: "Is the Disaster Response Plan updated at least annually or upon significant changes?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-BCR-10.1"
    text: "Is the disaster response plan exercised annually or upon significant changes, including, if possible, the participation of local emergency authorities?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-BCR-11.1"
    text: "Are business-critical equipment supplemented with both locally redundant and geographically dispersed equipment located at a reasonable minimum distance in accordance with applicable industry standards?"
    section: "Business Continuity Management and Operational Resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-01.1"
    text: "Are policies and procedures for managing the risks associated with applying changes to assets owned, controlled or used by the organization, established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-CCC-01.2"
    text: "Are the policies and procedures reviewed and updated at least annually or upon significant changes?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-CCC-02.1"
    text: "Is a defined quality change control, approval and testing process incorporating baselines, testing and release standards, established, maintained and implemented?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-03.1"
    text: "Is a change management procedure implemented to manage the risks associated with applying changes to assets owned, controlled or used by the organization?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-04.1"
    text: "Are procedures implemented and enforced to authorize the addition, removal, update, and management of assets that are owned, controlled, or used by the organization?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-05.1"
    text: "Are provisions included that limit changes impacting directly service customer owned environments (tenants) to explicitly authorized requests within service level agreements?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-06.1"
    text: "Are change management and configuration baselines established, documented and implemented for all relevant authorized changes on organization assets?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-06.2"
    text: "Are the baselines reviewed and updated at least annually or upon significant changes?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-CCC-07.1"
    text: "Are detection measures with proactive notification implemented in case of changes deviating from the established baseline?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-08.1"
    text: "Is a procedure implemented (aligning with the requirements of GRC-04: Policy Exception Process) for the management of exceptions, including emergencies, in the change and configuration process?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CCC-09.1"
    text: "Is a process defined and implemented to proactively roll back changes to a previous known good state in case of errors or security concerns?"
    section: "Change Control and Configuration Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-01.1"
    text: "Are cryptography, encryption, and key management policies and procedures established, documented, approved, communicated, applied, evaluated, and maintained?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-CEK-01.2"
    text: "Are cryptography, encryption, and key management policies and procedures reviewed and updated at least annually or upon significant changes?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis von Richtlinien und Prozessen (Kontrollziel)"
  - id: "CAIQ-CEK-02.1"
    text: "Are cryptography, encryption, and key management roles and responsibilities defined and implemented?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-03.1"
    text: "Is data protection, at-rest, in-transit and where applicable in-use, provided by using cryptographic libraries certified to approved standards?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-04.1"
    text: "Are encryption algorithms utilized following industry standards for protecting data, based on the data classification and associated risks?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-05.1"
    text: "Are standard change management procedures established to review, approve, implement, and communicate cryptography, encryption, and key management technology changes that accommodate internal and external sources?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-06.1"
    text: "Are changes to cryptography-, encryption- and key management-related systems, policies, and procedures, managed and adopted in a manner that fully accounts for downstream effects of proposed changes, including residual risk, cost, and benefits analysis?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-07.1"
    text: "Is a cryptography, encryption, and key management risk program established and maintained that includes risk assessment, risk treatment, risk context, monitoring, and feedback provisions?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-08.1"
    text: "Are service providers providing service customers with the capability to manage their own data encryption keys?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-09.1"
    text: "Are encryption and key management systems, policies, and processes audited with a frequency proportional to the system's risk exposure?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-09.2"
    text: "Are encryption and key management systems, policies, and processes audited preferably continuously but at least annually and after any security event?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis regelmäßiger Überprüfung (Kontrollziel)"
  - id: "CAIQ-CEK-10.1"
    text: "Are cryptographic keys generated using industry-accepted and approved cryptographic libraries that specify algorithm strength and random number generator specifications?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-11.1"
    text: "Are cryptographic secrets and private keys that are provisioned for a unique purpose properly managed?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Nachweis einer technischen oder organisatorischen Kontrolle"
  - id: "CAIQ-CEK-12.1"
    text: "Are cryptographic keys rotated based on a cryptoperiod calculated while considering information disclosure risks, and legal and regulatory requirements?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-13.1"
    text: "Are cryptographic keys revoked and removed before the end of the established cryptoperiod (when a key is compromised, or an entity is no longer part of the organization) per defined, implemented, and evaluated processes, procedures, and technical measures which include legal and regulatory req [...]"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-14.1"
    text: "Are processes, procedures, and technical measures which include provisions for legal and regulatory requirements, defined, implemented and evaluated, to securely destroy cryptographic keys when they are no longer needed?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-15.1"
    text: "Are processes, procedures, and technical measures to create keys in a pre-activated state (i.e., when they have been generated but not authorized for use) defined, implemented, and evaluated, including provisions for legal and regulatory requirements?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-16.1"
    text: "Are processes, procedures, and technical measures to monitor, review, and approve key transitions (e.g., from any state to/from suspension) defined, implemented, and evaluated including provisions for legal and regulatory requirements?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-17.1"
    text: "Are processes, procedures, and technical measures to deactivate keys (at the time of their expiration date) defined, implemented, and evaluated including provisions for legal and regulatory requirements?"
    section: "Cryptography, Encryption & Key Management"
    class_rater1: c
    rationale: "Stufe 2: Kontroll- oder Prozessnachweis; Verweis auf geltendes Recht nur generisch, außerhalb Korpus"
  - id: "CAIQ-CEK-18.1"
    text: "Are processes, procedures, and technical measures to manage archived keys in a secure repository (requiring least privilege access) defined, implemented, and evaluated including provisions for legal and regulatory requirements?"
