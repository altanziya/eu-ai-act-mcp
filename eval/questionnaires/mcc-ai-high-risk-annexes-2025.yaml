questions:
  - id: "MCC-A-1"
    text: "Please provide a description of the AI System(s). This can also be an algorithmic system that does not qualify as an AI System under the AI Act."
    section: "Annex A"
    class_rater1: c
    rationale: "Stufe 5: Systembeschreibung (Sachverhalt), keine Einstufung"
  - id: "MCC-A-2"
    text: "Please provide a description of the use for which the AI System is intended."
    section: "Annex A"
    class_rater1: c
    rationale: "Stufe 5: Beschreibung des Verwendungszwecks (Sachverhalt); Eingabe für eine Einstufung, selbst keine"
  - id: "MCC-B-1"
    text: "Please provide a description of the Data Sets used for the training (if applicable), validation and testing of the AI System. Distinguish between Public Organisation Data Sets and Supplier Data Sets and Third-Party Data Sets."
    section: "Annex B"
    class_rater1: c
    rationale: "Stufe 2: Beschreibung und Nachweis der Datensätze"
  - id: "MCC-E-1"
    text: "Please provide here a description of the technical and organisational measures to be taken by the Supplier to ensure transparency in accordance with article 6 of the MCC-AI-High-Risk."
    section: "Annex E"
    class_rater1: c
    rationale: "Stufe 2: Beschreibung technischer und organisatorischer Maßnahmen (Nachweis)"
  - id: "MCC-F-1"
    text: "Please provide here a description of the technical and organisational measures to be taken by the Supplier to ensure human oversight in accordance with article 7 of the MCC-AI-High-Risk."
    section: "Annex F"
    class_rater1: c
    rationale: "Stufe 2: Beschreibung technischer und organisatorischer Maßnahmen (Nachweis)"
  - id: "MCC-G-1"
    text: "Describe here the required levels of accuracy."
    section: "Annex G"
    class_rater1: c
    rationale: "Stufe 5: vertragliche Festlegung von Genauigkeitsniveaus, keine Rechtsfrage"
  - id: "MCC-H-1"
    text: "Please provide here a description of the technical and organisational measures to be taken by the Supplier to ensure an appropriate level of robustness, safety and cybersecurity in accordance with article 8 of the MCC-AI-High-Risk."
    section: "Annex H"
    class_rater1: c
    rationale: "Stufe 2: Beschreibung technischer und organisatorischer Maßnahmen (Nachweis)"
