extraction:
  method: "JSON-Schema-Dateien per Skript durchlaufen; je Schlüssel mit Titel eine Frage, Duplikate in den Abhängigkeitsblöcken zusammengefasst; Antwortoptionen als context."
  n_questions: 50
  exclusions: "Ergebnisseiten (output*), Zwischenausgaben, der Pseudo-Schlüssel art50detail; Identifikations-Fragebogen (Ist es ein KI-System?), Pflichten-Fragebogen und niederländische NTA-Fragebögen wurden nicht ausgewertet."
  notes: "Das Tool ist ein Entscheidungsbaum: Fragen erscheinen abhängig von früheren Antworten. Es zählen alle einzigartigen Fragen (Schlüssel). Texte stammen aus der englischen Fassung; Optionslisten sind auf 400 Zeichen gekürzt. Extraktion programmatisch aus JSON: Fragen, die nur in uiSchema oder in Übersetzungsdateien stehen, wären nicht erfasst."
rater1: Claude (Sonnet 5.5), Durchgang 1, 2026-10-03
questions:
  - id: "AA-AI1-risk-annexI"
    text: "Does your AI system fall within the scope of Annex I of the AI Act — either as the product itself, or as a safety component of a regulated product?"
    section: "AI1-risk"
    context: "Antwortoptionen: None of the below | Toy safety ([Directive 2009/48/EC](https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32009L0048)) | Recreational craft and personal watercraft ([Directive 2013/53/EU](https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32013L0053)) | Lifts and safety components of lifts ([Directive 2014/33/EU](https://eur-lex.europa.eu/eli/dir/2014 [...]"
    class_rater1: b
    rationale: "Subsumtion unter Anhang I / Art. 6 Abs. 1 (Produkt oder Sicherheitsbauteil)"
  - id: "AA-AI1-risk-III.1"
    text: "Does the AI system use biometric data?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "[U:c] Rechtsbegriff biometrische Daten (Art. 3), aber nahe an reiner Sachverhaltsfrage; Gate zu Anhang III Nr. 1"
  - id: "AA-AI1-risk-III.1.1"
    text: "What does the AI system do with biometric data?"
    section: "AI1-risk"
    context: "Antwortoptionen: Creates or expands a facial recognition database. | Remote identification of individuals. | For categorizing (labelling) people. | Recognizes or infers emotions or intentions. | Other purpose."
    class_rater1: b
    rationale: "[U:c] Zuordnung der Nutzung biometrischer Daten zu den Tatbeständen (Identifizierung, Kategorisierung, Emotionserkennung)"
  - id: "AA-AI1-risk-5.e.2"
    text: "Does this involve large-scale collection of facial images from the internet or security cameras (scraping)?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. e (ungezieltes Auslesen von Gesichtsbildern)"
  - id: "AA-AI1-risk-5.h.verify"
    text: "Is the AI system only used to confirm that someone is who they say they are (verification or authentication)?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahme Verifizierung/Authentifizierung bei biometrischer Identifizierung (Art. 3, Anhang III Nr. 1)"
  - id: "AA-AI1-risk-5.g.1"
    text: "Does the AI system estimate race, ethnicity or origin, political opinions, trade union membership, religious or philosophical beliefs, sex life or sexual orientation?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. g (biometrische Kategorisierung sensibler Merkmale)"
  - id: "AA-AI1-risk-5.f.1"
    text: "Is the AI system used in the workplace or in education?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Arbeitsplatz oder Bildung aus Art. 5 Abs. 1 Buchst. f"
  - id: "AA-AI1-risk-III.1.2"
    text: "Is the AI system used in publicly accessible spaces for the purpose of law enforcement (investigation or prosecution or the execution of criminal justice)?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. h (Echtzeit-Fernidentifizierung, Strafverfolgung)"
  - id: "AA-AI1-risk-III.1.2-prohibited"
    text: "Which of the following scenarios apply to your AI system?"
    section: "AI1-risk"
    context: "Antwortoptionen: The AI system is used in the search for victims of crime including missing persons or threats to the life or to the physical safety of natural persons or of a terrorist attack or the localisation or identification of perpetrators or suspects of specific criminal offences as listed in the user guidance below | A fundamental rights impact assessment (FRIA) has been conducted f [...]"
    class_rater1: b
    rationale: "Ausnahmen nach Art. 5 Abs. 1 Buchst. h Ziff. i bis iii, Zuordnung zum Sachverhalt"
  - id: "AA-AI1-risk-cybersec"
    text: "Is the system used solely for the purpose of enabling cybersecurity and personal data protection measures?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahmetatbestand im Anhang III (ausschließlich Cybersicherheit und Datenschutz), Subsumtion"
  - id: "AA-AI1-risk-art50"
    text: "Does one of the following scenarios apply to the AI system?"
    section: "AI1-risk"
    context: "Antwortoptionen: It interacts directly with natural persons. | It generates synthetic audio, image, video or text content. | It recognises emotions or categorises persons based on biometric data. | It generates or manipulates image, audio, video or public-interest text content. | None of the above"
    class_rater1: b
    rationale: "Subsumtion unter die Szenarien des Art. 50"
  - id: "AA-AI1-risk-art50.nudify"
    text: "Is the AI system used for non-consensual fake nude imagery?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter ein im Tool abgebildetes Verbot oder eine Pflicht (nicht einvernehmliche Nacktbilder)"
  - id: "AA-AI1-risk-annexIIIGate"
    text: "Does the AI system fall within any of the following domains?"
    section: "AI1-risk"
    context: "Antwortoptionen: Critical physical and digital infrastructure | Education or vocational training | Employment or HR | Government benefits or public services | Assessment of creditworthiness, life and health insurances or emergency services | Law enforcement | Migration, asylum or border control | Administration of justice or dispute resolution | Elections or democratic processes | None of th [...]"
    class_rater1: b
    rationale: "Zuordnung zu den Bereichen des Anhangs III"
  - id: "AA-AI1-risk-III.2.4"
    text: "Does the AI system fulfill a safety function within the management or operation of this infrastructure?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Sicherheitsfunktion in kritischer Infrastruktur, Anhang III Nr. 2"
  - id: "AA-AI1-risk-III.2.5"
    text: "Is the AI system used solely for cybersecurity purposes (e.g., defending IT systems, detecting threats, preventing intrusions)?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahme ausschließlich Cybersicherheit, Anhang III Nr. 2 (Subsumtion)"
  - id: "AA-AI1-risk-III.2.6-cer"
    text: "Is the AI system intended to be used by an entity identified as critical under the Critical Entities Resilience Directive?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: c
    rationale: "[U:b] Status als kritische Einrichtung nach CER-Richtlinie: Maßstab außerhalb Korpus (Stufe 1), Auskunft über Betreiber"
  - id: "AA-AI1-risk-III.3.uses"
    text: "In which of the following education contexts is the AI system used?"
    section: "AI1-risk"
    context: "Antwortoptionen: Allocation or admission of students to education, training or schooling | Assessing the level or quality of education someone receives | Evaluating learning outcomes (assessment leading to a grade, qualification, certification or progression decision) | Monitoring or detecting unauthorised behaviour of students during tests (e.g., proctoring, or anti-cheating software). | No [...]"
    class_rater1: b
    rationale: "Zuordnung zu den Bildungsfällen in Anhang III Nr. 3"
  - id: "AA-AI1-risk-III.4.uses"
    text: "In which of the following employment areas is the AI system used?"
    section: "AI1-risk"
    context: "Antwortoptionen: Placing targeted job advertisements | Analysing or filtering applications | Evaluating candidates | Decisions affecting terms of work-related relationships | Decisions affecting promotion and termination of work-related contractual relationship | Task allocation among employees | None of the above"
    class_rater1: b
    rationale: "Zuordnung zu den Beschäftigungsfällen in Anhang III Nr. 4"
  - id: "AA-AI1-risk-III.4.monitor"
    text: "Does the AI system monitor or evaluate the performance or behaviour of employees?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Überwachung/Bewertung von Beschäftigten, Anhang III Nr. 4 Buchst. b"
  - id: "AA-AI1-risk-III.5.decision"
    text: "Is the AI system used to assess whether someone is eligible for a service, provision or benefit, or to decide whether a service is granted, denied, limited, withdrawn or reclaimed?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Anspruchsprüfung für Leistungen, Anhang III Nr. 5 Buchst. a"
  - id: "AA-AI1-risk-III.5.private"
    text: "Is the AI system used for any of the following?"
    section: "AI1-risk"
    context: "Antwortoptionen: Creditworthiness assessment or credit scoring of individuals | Risk assessment or pricing for life or health insurance | Evaluating emergency calls, deploying or prioritising emergency services or triage of urgent medical care | None of the above"
    class_rater1: b
    rationale: "Zuordnung zu den Fällen in Anhang III Nr. 5 Buchst. b bis d"
  - id: "AA-AI1-risk-III.6-5.d"
    text: "Is the AI system used in assessing the risk that someone will (re)commit a criminal offense?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Risikobewertung zur Straffälligkeit, Anhang III Nr. 6 Buchst. d"
  - id: "AA-AI1-risk-III.6-5.d.solely"
    text: "Is the risk assessment based solely on profiling of the natural person or on assessing personality traits and characteristics?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. d (ausschließlich Profiling) bzw. Anhang III Nr. 6"
  - id: "AA-AI1-risk-III.6.uses"
    text: "Does the AI system do any of the following?"
    section: "AI1-risk"
    context: "Antwortoptionen: Assessing or estimating that someone will become a victim of crime | Acting as a polygraph or similar instrument | Assessing the reliability of evidence | Automatically evaluating or predicting characteristics, behaviour or personal aspects (profiling) in the context of crime and assessing personality traits, characteristics or previous criminal behaviour | None of the above"
    class_rater1: b
    rationale: "Zuordnung zu den Strafverfolgungsfällen in Anhang III Nr. 6"
  - id: "AA-AI1-risk-III.7.uses"
    text: "Does the AI system do any of the following?"
    section: "AI1-risk"
    context: "Antwortoptionen: Acting as a polygraph or similar instrument | Assessing risks for a person entering EU territory | Processing asylum, visa or residence-permit applications or related complaints | None of the above"
    class_rater1: b
    rationale: "Zuordnung zu den Migrationsfällen in Anhang III Nr. 7"
  - id: "AA-AI1-risk-III.7.4"
    text: "Is the AI system used for the detection, recognition or identification of individuals?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Erkennung oder Identifizierung von Personen, Anhang III Nr. 7 Buchst. d"
  - id: "AA-AI1-risk-III.7.5"
    text: "Is the AI system solely used to verify a passport or other travel document to confirm that a specific person is who they claim to be?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahme Prüfung von Reisedokumenten, Anhang III Nr. 7"
  - id: "AA-AI1-risk-III.8.2"
    text: "Is the AI system used only for supporting administrative activities that do not affect the judiciary in individual cases?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahme rein unterstützende Verwaltungstätigkeit, Anhang III Nr. 8"
  - id: "AA-AI1-risk-III.8.elections"
    text: "Is the AI system intended to be used to influence the outcome of an election or referendum, or to influence the voting behaviour of natural persons (including their decision to vote, abstain, or cast a blank or invalid ballot) in the exercise of their vote?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Beeinflussung von Wahlen, Anhang III Nr. 8 Buchst. b"
  - id: "AA-AI1-risk-5.a"
    text: "Does the AI system use techniques people cannot consciously perceive (e.g., subliminal techniques), or is it designed — or known to unintentionally — manipulate people's behaviour or choices without their awareness?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. a (unterschwellige Beeinflussung)"
  - id: "AA-AI1-risk-5.c"
    text: "Does the AI system evaluate, score or classify individuals based on their social behaviour or personal characteristics in a way that could lead to unfavourable treatment?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Subsumtion unter Art. 5 Abs. 1 Buchst. c (Social Scoring)"
  - id: "AA-AI1-risk-5.a.4"
    text: "Can the AI system potentially have negative consequences for the user or other people?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "[U:c] Schadensmerkmal aus Art. 5 Abs. 1 Buchst. a, formuliert als allgemeine Risikoeinschätzung"
  - id: "AA-AI1-risk-5.c.treat"
    text: "Does the unfavourable treatment occur in a completely different context from the behaviour or characteristic it is based on or is it disproportionate to that behaviour?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmale nachteilige Behandlung in anderem Kontext oder unverhältnismäßig, Art. 5 Abs. 1 Buchst. c"
  - id: "AA-AI1-risk-exceptions"
    text: "Does one of the following exceptions apply to your application?"
    section: "AI1-risk"
    context: "Antwortoptionen: Scientific research and scientific development. | Defense or military purposes. | National security purposes. | None of the above."
    class_rater1: b
    rationale: "Ausnahmen vom Anwendungsbereich (Forschung, Militär, nationale Sicherheit), Art. 2"
  - id: "AA-AI1-risk-2.6-yes"
    text: "Provide a brief description of the research. Include in this description at least the purpose of the research, the department within which this research is conducted, and the involved research institutes and/or other partners."
    section: "AI1-risk"
    class_rater1: c
    rationale: "Stufe 5: Freitextbeschreibung der Forschung (Auskunftsverlangen)"
  - id: "AA-AI1-risk-6.1"
    text: "Is the AI system used to automatically evaluate or predict characteristics, behaviour or personal aspects?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Profiling aus Art. 6 Abs. 3 letzter Unterabsatz"
  - id: "AA-AI1-risk-6.2"
    text: "Does the AI system fall within one of the following scenarios?"
    section: "AI1-risk"
    context: "Antwortoptionen: A narrow procedural task | The improvement of the result of a previously human-performed activity | The detection of decision-making patterns or deviations from previous decision-making patterns | A preparatory step that does not influence the outcome | None of the above"
    class_rater1: b
    rationale: "Ausnahmegründe nach Art. 6 Abs. 3 Buchst. a bis d"
  - id: "AA-AI1-risk-6.3"
    text: "Which of the following scenarios apply?"
    section: "AI1-risk"
    context: "Antwortoptionen: The human assessment is completed | The AI system only performs an ex-post comparative assessment, which involves determining whether a current decision aligns with previous patterns or decisions. | The AI system doesn't replace or influence the previously completed human assessment without proper human review."
    class_rater1: b
    rationale: "Konkretisierung der Ausnahmegründe nach Art. 6 Abs. 3"
  - id: "AA-AI1-risk-art6.thirdParty"
    text: "Is the product whose safety component is the AI system, or the AI system itself as a product, required to undergo a third-party conformity assessment under EU harmonisation legislation?"
    section: "AI1-risk"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Merkmal Drittkonformitätsbewertung, Art. 6 Abs. 1 Buchst. b"
  - id: "AA-AI2-role-q12"
    text: "How is the AI system developed or deployed?"
    section: "AI2-role"
    context: "Antwortoptionen: We develop and use the AI system ourselves. | We only develop the AI system. | We develop the AI system and others also use it. | We use an externally developed AI system. | We import the AI system from a supplier outside the EU. | We buy the AI system from a supplier within the EU and resell it. | We represent a non-EU person or entity to carry out AI Act obligations. | You [...]"
    class_rater1: b
    rationale: "Rollenbestimmung nach Art. 3 (Anbieter, Betreiber, Einführer)"
  - id: "AA-AI2-role-q13"
    text: "Is the AI system already in use?"
    section: "AI2-role"
    context: "Antwortoptionen: In use | In development"
    class_rater1: c
    rationale: "[U:b] Sachverhalt (in Betrieb oder Entwicklung), nur indirekt relevant für Anwendbarkeitsdatum"
  - id: "AA-AI2-role-q12b"
    text: "Does one of the following scenarios apply to your AI system?"
    section: "AI2-role"
    context: "Antwortoptionen: The name or trademark of your organization is put on the AI system. | A substantial modification has been made to the AI system. | The intended purpose of the AI system is modified by your organization. | None of the above."
    class_rater1: b
    rationale: "Rollenwechsel nach Art. 25 (Marke, wesentliche Änderung, Zweckänderung)"
  - id: "AA-ART50-generalException"
    text: "Does one of the following exceptions apply to your application?"
    section: "ART50"
    context: "Antwortoptionen: Deployers acting in the context of purely personal non-professional activity | Research and development | AI released under free and open-source licenses | None of the above"
    class_rater1: b
    rationale: "Ausnahmen vom Anwendungsbereich, Art. 2"
  - id: "AA-ART50-generalExceptionResearchDescription"
    text: "Provide a brief description of the research. Include in this description at least the purpose of the research, the department within which this research is conducted, and the involved research institutes and/or other partners."
    section: "ART50"
    class_rater1: c
    rationale: "Stufe 5: Freitextbeschreibung der Forschung (Auskunftsverlangen)"
  - id: "AA-ART50-scenarios"
    text: "Does one of the following scenarios apply to the AI system?"
    section: "ART50"
    context: "Antwortoptionen: It interacts directly with natural persons. | It generates or manipulates synthetic audio, image, video or text content. | It recognises emotions or categorises persons based on biometric data. | It generates or manipulates image, audio or video content that resembles real people, objects, places or events (a deep fake). | It generates or manipulates text published to inform [...]"
    class_rater1: b
    rationale: "Subsumtion unter die Szenarien des Art. 50"
  - id: "AA-ART50-interactiveException"
    text: "Your AI system interacts directly with natural persons. Which of the following scenarios apply to your AI system?"
    section: "ART50"
    context: "Antwortoptionen: It is obvious to a well-informed, observant and circumspect natural person that it is interacting with an AI system | The AI system is authorised by law for law enforcement purposes | None of the above"
    class_rater1: b
    rationale: "Ausnahmen nach Art. 50 Abs. 1"
  - id: "AA-ART50-syntheticException"
    text: "Your AI system generates or manipulates synthetic audio, image, video or text content. Which of the following scenarios apply to your AI system?"
    section: "ART50"
    context: "Antwortoptionen: The AI system performs an assistive function for standard editing | The AI system does not substantially alter the input data provided by the deployer or the semantics thereof | The AI system is authorised by law to generate or manipulate synthetic content to detect, prevent, investigate or prosecute criminal offence | None of the above"
    class_rater1: b
    rationale: "Ausnahmen nach Art. 50 Abs. 2"
  - id: "AA-ART50-biometricException"
    text: "Your AI system recognises emotions or categorises persons based on biometric data. Is it used for the purpose of law enforcement?"
    section: "ART50"
    context: "Antwortoptionen: Yes | No"
    class_rater1: b
    rationale: "Ausnahme nach Art. 50 Abs. 3 (Strafverfolgung)"
  - id: "AA-ART50-deepfakeException"
    text: "Your AI system generates or manipulates image, audio or video content that resembles real people, objects, places or events (a deep fake). Which of the following scenarios apply to your AI system?"
    section: "ART50"
    context: "Antwortoptionen: The deep fake forms a part of evidently artistic, creative, satirical, fictional or analogous work | The deep fake is authorised by law to detect, prevent, investigate or prosecute criminal offences | None of the above"
    class_rater1: b
    rationale: "Ausnahmen nach Art. 50 Abs. 4 (Deepfakes)"
  - id: "AA-ART50-publicInterestTextException"
    text: "Your AI system generates or manipulates text published to inform the public on matters of public interest. Which of the following scenarios apply to your AI system?"
    section: "ART50"
    context: "Antwortoptionen: The text is under human review or editorial control and editorial responsibility | The use of the AI system for generating text published with the purpose of informing the public on matters of public interest without human review is authorised by law to detect, prevent, investigate or prosecute criminal offences | None of the above"
    class_rater1: b
    rationale: "Ausnahmen nach Art. 50 Abs. 4 (Text von öffentlichem Interesse)"
