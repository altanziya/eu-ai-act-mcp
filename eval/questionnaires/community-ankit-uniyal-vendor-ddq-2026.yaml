  authority: "Community-Vorlage einer Privatperson, nicht institutionell, keine Prüfung durch Dritte erkennbar, möglicherweise LLM-gestützt erstellt. Zeigt aber, was Praktiker in einen KI-Lieferantenfragebogen schreiben; nennt den AI Act in zwei von 45 Punkten."
extraction:
  method: "Markdown-Datei, nummerierte Punkte 1 bis 45 mit Regex extrahiert."
  n_questions: 43
  exclusions: "Punkte 1 und 2 (Identifikationsfelder: Rechtsträger, Produktname); Bewertungsabschnitt."
  notes: "Punkte sind teils als Stichwort-Felder mit Doppelpunkt formuliert; sie zählen als Auskunftsverlangen."
rater1: Claude (Sonnet 5.5), Durchgang 1, 2026-10-03
questions:
  - id: "ANKIT-03"
    text: "Description of AI functionality (what does the AI do?):"
    section: "A Vendor and product"
    class_rater1: c
    rationale: "Stufe 5: Beschreibung der KI-Funktion (Sachverhalt)"
  - id: "ANKIT-04"
    text: "AI technique(s) used (ML, deep learning, foundation model, RAG, agentic):"
    section: "A Vendor and product"
    class_rater1: c
    rationale: "Stufe 5: Angabe der KI-Technik (Sachverhalt)"
  - id: "ANKIT-05"
    text: "If foundation model: name, version, provider, hosting region:"
    section: "A Vendor and product"
    class_rater1: c
    rationale: "Stufe 5: Angabe des Basismodells (Sachverhalt)"
  - id: "ANKIT-06"
    text: "Is the model fine-tuned on customer data? On what terms?"
    section: "A Vendor and product"
    class_rater1: c
    rationale: "Stufe 5: Sachverhalt (Feintuning mit Kundendaten)"
  - id: "ANKIT-07"
    text: "What customer data flows to the AI? (categories, volume, sensitivity)"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Datenflüsse (Sachverhalt), DSGVO-nah"
  - id: "ANKIT-08"
    text: "Will customer data be used to train or improve the vendor's models? If yes, on what basis and how can it be turned off?"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Sachverhalt (Training mit Kundendaten)"
  - id: "ANKIT-09"
    text: "Where is data processed and stored? (regions)"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Sachverhalt (Verarbeitungsort)"
  - id: "ANKIT-10"
    text: "Data residency options for EU and UAE customers?"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Angebot (Datenresidenz)"
  - id: "ANKIT-11"
    text: "Encryption at rest and in transit?"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 2: technische Maßnahme (Verschlüsselung), außerhalb Korpus"
  - id: "ANKIT-12"
    text: "Customer-managed keys (BYOK / HYOK) supported?"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 2: technische Maßnahme (Schlüsselverwaltung), außerhalb Korpus"
  - id: "ANKIT-13"
    text: "Retention period and deletion guarantees?"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Aufbewahrung und Löschung (Datenschutzsachverhalt)"
  - id: "ANKIT-14"
    text: "Sub-processors list and notification process:"
    section: "B Data"
    class_rater1: c
    rationale: "Stufe 5: Unterauftragsverarbeiter (DSGVO-Sachverhalt)"
  - id: "ANKIT-15"
    text: "SOC 2 Type II, ISO 27001, ISO 27017/18, ISO/IEC 42001 status (and recent reports):"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 1: Zertifikate und Normen (SOC 2, ISO), außerhalb Korpus"
  - id: "ANKIT-16"
    text: "Penetration testing cadence; willing to share executive summary?"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Penetrationstests"
  - id: "ANKIT-17"
    text: "AI-specific threat-modelling: prompt injection, model theft, data poisoning, etc.:"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Bedrohungsmodellierung"
  - id: "ANKIT-18"
    text: "Guardrail / content-filter capabilities:"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 2: technische Schutzmaßnahme (Guardrails)"
  - id: "ANKIT-19"
    text: "Incident response: SLA for notification (e.g., 24h, 72h)?"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 5: Zusage Meldefrist (Vertrags-/Prozesssachverhalt)"
  - id: "ANKIT-20"
    text: "Business continuity / DR posture and RTO/RPO:"
    section: "C Security and resilience"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Notfallplanung"
  - id: "ANKIT-21"
    text: "Documented training data sources?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Trainingsdatenquellen"
  - id: "ANKIT-22"
    text: "Bias and fairness testing performed? Evidence?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Bias-Tests"
  - id: "ANKIT-23"
    text: "Explainability features?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 2: Produktfunktion (Erklärbarkeit)"
  - id: "ANKIT-24"
    text: "Drift monitoring and retraining cadence?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Monitoring und Retraining"
  - id: "ANKIT-25"
    text: "Model-change notification: how much advance notice will you give for material model changes?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 5: Zusage Änderungsmitteilung (Vertragssachverhalt)"
  - id: "ANKIT-26"
    text: "Versioning and rollback support?"
    section: "D Model and lifecycle"
    class_rater1: c
    rationale: "Stufe 2: Produktfunktion (Versionierung)"
  - id: "ANKIT-27"
    text: "GDPR / UAE PDPL / DIFC DPL alignment statements?"
    section: "E Privacy and compliance"
    class_rater1: c
    rationale: "Stufe 1: DSGVO und andere Datenschutzgesetze, außerhalb Korpus"
  - id: "ANKIT-28"
    text: "Standard DPA available?"
    section: "E Privacy and compliance"
    class_rater1: c
    rationale: "Stufe 5: Verfügbarkeit eines Vertragsdokuments (DPA)"
  - id: "ANKIT-29"
    text: "Cross-border transfer mechanisms supported?"
    section: "E Privacy and compliance"
    class_rater1: c
    rationale: "Stufe 1: Transfermechanismen (DSGVO), außerhalb Korpus"
  - id: "ANKIT-30"
    text: "EU AI Act readiness: provider obligations, Code of Practice (if GPAI provider):"
    section: "E Privacy and compliance"
    class_rater1: c
    rationale: "[U:b] Auskunft zur AI-Act-Bereitschaft; Anbieterpflichten wären b, die Frage verlangt aber Bereitschaftsaussage"
  - id: "ANKIT-31"
    text: "Children's data handling?"
    section: "E Privacy and compliance"
    class_rater1: c
    rationale: "Stufe 1: Kinderdaten (DSGVO-nah), außerhalb Korpus"
  - id: "ANKIT-32"
    text: "Will end-users know they are interacting with AI?"
    section: "F Transparency"
    class_rater1: c
    rationale: "Stufe 2: Maßnahme (Information der Nutzer); fragt nach Umsetzung, nicht nach Geltung von Art. 50"
  - id: "ANKIT-33"
    text: "Watermarking / provenance markers in outputs?"
    section: "F Transparency"
    class_rater1: c
    rationale: "Stufe 2: Produktfunktion (Wasserzeichen, Herkunftsmarker)"
  - id: "ANKIT-34"
    text: "Logs of prompts and outputs accessible to the customer?"
    section: "F Transparency"
    class_rater1: c
    rationale: "Stufe 2: Produktfunktion (Zugriff auf Protokolle)"
  - id: "ANKIT-35"
    text: "Indemnity for IP infringement by outputs?"
    section: "G Contracts"
    class_rater1: c
    rationale: "Stufe 5: Vertragsfrage (Freistellung)"
  - id: "ANKIT-36"
    text: "Right to audit (paper-based and on-site)?"
    section: "G Contracts"
    class_rater1: c
    rationale: "Stufe 5: Vertragsfrage (Auditrecht)"
  - id: "ANKIT-37"
    text: "Right to source code escrow (if appropriate)?"
    section: "G Contracts"
    class_rater1: c
    rationale: "Stufe 5: Vertragsfrage (Escrow)"
  - id: "ANKIT-38"
    text: "Exit and data-portability terms?"
    section: "G Contracts"
    class_rater1: c
    rationale: "Stufe 5: Vertragsfrage (Ausstieg)"
  - id: "ANKIT-39"
    text: "Limitation of liability — what is the cap?"
    section: "G Contracts"
    class_rater1: c
    rationale: "Stufe 5: Vertragsfrage (Haftungsgrenze)"
  - id: "ANKIT-40"
    text: "Published responsible-AI principles? Link:"
    section: "H Ethics and responsible AI"
    class_rater1: c
    rationale: "Stufe 2: Nachweis veröffentlichter Grundsätze"
  - id: "ANKIT-41"
    text: "Internal AI governance and red-team capability:"
    section: "H Ethics and responsible AI"
    class_rater1: c
    rationale: "Stufe 2: Nachweis Governance und Red Teaming"
  - id: "ANKIT-42"
    text: "Has the vendor declined any customer requests on ethical grounds?"
    section: "H Ethics and responsible AI"
    class_rater1: c
    rationale: "Stufe 5: Sachverhalt zur Geschäftspolitik"
  - id: "ANKIT-43"
    text: "Funding runway / public financials:"
    section: "I Concentration and viability"
    class_rater1: c
    rationale: "Stufe 5: Geschäftsangabe (Finanzierung)"
  - id: "ANKIT-44"
    text: "Customer references in our sector:"
    section: "I Concentration and viability"
    class_rater1: c
    rationale: "Stufe 5: Referenzen (Geschäftsangabe)"
  - id: "ANKIT-45"
    text: "Roadmap alignment with EU AI Act, NIST AI RMF, ISO/IEC 42001:"
    section: "I Concentration and viability"
    class_rater1: c
    rationale: "Stufe 1: Roadmap-Bezug auf AI Act, NIST und ISO (Selbstauskunft), außerhalb Korpus für den Normenanteil; Dominanzregel c"
