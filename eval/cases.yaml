- id: E09
  kind: evaluation
  subset: evaluation
  question: 'Is the following statement about the EU AI Act correct as of 2026-10-05? Statement: Article 10(5) of the EU AI Act has been
    deleted; Article 4a(1) now provides: "To the extent strictly necessary to ensure bias detection and correction in relation to high-risk
    AI systems in accordance with Article 10(2), points (f) and (g), of this Regulation, providers of such systems may exceptionally process
    special categories of personal data".'
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    verdict: correct
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(6); Art. 1(9)(b)
    quote: To the extent strictly necessary to ensure bias detection and correction in relation to high-risk AI systems [...] providers of such
      systems may exceptionally process special categories of personal data
  legal_review: llm_second_rater
  notes: "Error type: -. Both parts verified (deletion and new Art. 4a(1) wording). Note: art_10.par_5 exists only in the 2024 corpus.
    Provisions concerned: art_4a.par_1, art_10.par_5."
