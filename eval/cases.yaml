- id: A28
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, does an AI system that is solely used for non-safety related aspects such as convenience or quality control
    qualify as a safety component under the EU AI Act? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    articles:
      - art_6
    claim: no
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(8) (new Art. 6(1a))
    quote: AI systems that are solely used for non-safety related aspects of user assistance, performance optimisation, service efficiency,
      automation or convenience or quality control shall not qualify as safety components.
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Art. 6(1b) carve-back: systems whose failure would endanger health
    and safety do qualify; the question is restricted to the 'solely non-safety' class. Answer: no."
- id: A29
  kind: generation
  subset: version_deadline
  question: As of 5 October 2026, may small mid-cap enterprises (SMCs) provide the elements of the Annex IV technical documentation of a
    high-risk AI system in a simplified manner under the EU AI Act? Answer yes or no.
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    articles:
      - art_11
    claim: yes
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(10) (amended Art. 11(1))
    quote: SMEs, including start-ups, and SMCs, may provide the elements of the technical documentation specified in Annex IV in a simplified
      manner.
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. 2024 text covered only SMEs including start-ups. Answer: yes."
- id: A30
  kind: generation
  subset: version_deadline
  question: As of 15 March 2026, since what date does the AI literacy obligation of Article 4 of the EU AI Act apply?
  as_of: 2026-03-15
  knowable_before_omnibus: true
  origin: constructed
  expected:
    date: 2025-02-02
    articles:
      - art_4
      - art_113
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 113, third paragraph, point (a)
    quote: Chapters I and II shall apply from 2 February 2025
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 32024R1689. Pre-Omnibus date control; Art. 4 is in Chapter I."
- id: E01
  kind: evaluation
  subset: evaluation
  question: 'Is the following statement about the EU AI Act correct as of 2026-10-05? Statement: Article 113, third paragraph, point (c)(i)
    provides: "Chapter III, Sections 1, 2, and 3, with the exception of Article 6(5), shall apply from: (i) 2 December 2027 as regards AI
    systems classified as high-risk pursuant to Article 6(2) and Annex III" (Regulation (EU) 2024/1689, Art. 113(3)(c)(i)).'
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    verdict: correct
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(40)(b)
    quote: "Chapter III, Sections 1, 2, and 3, with the exception of Article 6(5), shall apply from: (i) 2 December 2027 as regards AI systems
      classified as high-risk pursuant to Article 6(2) and Annex III"
  legal_review: llm_second_rater
  notes: "Error type: -. Verbatim quote with correct pinpoint. Provisions concerned: art_113.sub_3.c.i."
- id: E02
  kind: evaluation
  subset: evaluation
  question: 'Is the following statement about the EU AI Act correct as of 2026-10-05? Statement: Article 113, third paragraph, point (c)
    provides: "Article 6(1) and the corresponding obligations in this Regulation shall apply from 2 August 2027." (Regulation (EU)
    2024/1689, Art. 113(3)(c)).'
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    verdict: incorrect
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(40)(b) (point (c) replaced)
    quote: 2 August 2028 as regards AI systems classified as high-risk pursuant to Article 6(1) and Annex I
  legal_review: llm_second_rater
  notes: "Error type: old_deadline. Quote is the superseded 2024 wording. Current: 2028-08-02 for Annex I systems. Provisions concerned:
    art_113.sub_3.c.ii."
- id: E03
  kind: evaluation
  subset: evaluation
  question: 'Is the following statement about the EU AI Act correct as of 2026-10-05? Statement: In the current consolidated version of
    Regulation (EU) 2024/1689, Article 111(2) reads: "this Regulation shall apply to operators of high-risk AI systems, other than the
    systems referred to in paragraph 1 of this Article, that have been placed on the market or put into service before 2 August 2026, only
    if, as from that date, those systems are subject to significant changes in their designs".'
  as_of: 2026-10-05
  knowable_before_omnibus: false
  origin: constructed
  expected:
    verdict: incorrect
  ground_truth:
    celex: 32026R1744
    pinpoint: Art. 1(39)(a) (new Art. 111(2))
    quote: that have been placed on the market or put into service before the date of application of Chapter III referred to in Article 113
  legal_review: llm_second_rater
  notes: "Error type: wrong_version. Quote is the 2024 wording (verified in 32024R1689 Art. 111(2)); current text refers to the date of
    application of Chapter III. Provisions concerned: art_111.par_2."
- id: E04
  kind: evaluation
  subset: evaluation
  question: 'Is the following statement about the EU AI Act correct as of 2026-10-05? Statement: Article 50(4) of the EU AI Act provides:
    "Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure
    that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated.".'
  as_of: 2026-10-05
  knowable_before_omnibus: true
  origin: constructed
  expected:
    verdict: incorrect
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 50(2)
    quote: Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure
      that the outputs of the AI system are marked in a machine-readable format
  legal_review: llm_second_rater
  notes: "Error type: wrong_pinpoint. Quote is verbatim but sits in Art. 50(2); Art. 50(4) concerns deployers of deep fakes. Provisions
    concerned: art_50.par_2."
