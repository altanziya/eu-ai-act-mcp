  question: I launch a new text-generating AI system on the EU market in September 2026. From which date must providers mark its outputs in a
    machine-readable format under Article 50(2) of the EU AI Act?
  as_of: 2026-10-05
  knowable_before_omnibus: true
  origin: real_user_question
