  expected:
    date: 2026-08-02
    articles:
      - art_50
      - art_113
  ground_truth:
    celex: 32024R1689
    pinpoint: Art. 113, second paragraph
    quote: It shall apply from 2 August 2026.
  legal_review: llm_second_rater
  notes: "Version relied on (descriptive, not scored): 02024R1689-20260727. Art. 50 is not among the exceptions in Art. 113(3) (amended by
    Art. 1(40) of 32026R1744), so the default date applies. Date unchanged by the Omnibus, but the Omnibus proposal of 2025 discussed
    delaying Art. 50(2); a model with stale knowledge may err. Class restricted to systems placed on the market after 2026-08-02 (legacy
    systems: A02)."
