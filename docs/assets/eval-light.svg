<title id="t">Errors per question: deadlines and versions after the 2026 amendment</title>
<desc id="d">Grouped horizontal bar chart. 45 pre-registered questions, three frontier models, without tools vs. with these MCP tools. Error share per arm: Claude Opus 5.5: no tools 24/45 (53 %), with tools v1 3/30 (10 %), with tools v2 2/15 (13 %). GPT-6 Astra: no tools 26/45 (58 %), v1 2/30 (7 %), v2 1/15 (7 %). Gemini 3.1 Pro: no tools 25/42 (60 %), v1 5/27 (19 %), v2 2/12 (17 %). Arms have different n; tool fixes after run v2 are not yet measured. Opus with web search alone: 6/45.</desc>
