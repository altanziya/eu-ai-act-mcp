<g id="n_eur" class="fx"><rect x="40" y="48" width="206" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="58" y="78" font-size="17" font-weight="700" fill="#e7ecf1">EUR-Lex / CELLAR</text>
<text class="sans" x="58" y="101" font-size="13" fill="#a5b2bf">XHTML · EN + DE</text>
</g>
<g id="n_par" class="fx"><rect x="292" y="48" width="250" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="310" y="78" font-size="17" font-weight="700" fill="#e7ecf1">Parser</text>
<text class="sans" x="310" y="101" font-size="13" fill="#a5b2bf">provision tree, stable IDs</text>
</g>
<g id="n_obl" class="fx"><rect x="292" y="194" width="250" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="310" y="224" font-size="17" font-weight="700" fill="#e7ecf1">Obligations map</text>
<text class="sans" x="310" y="247" font-size="13" fill="#a5b2bf">95 entries · 106 quotes checked</text>
</g>
<g id="n_cor" class="fx"><rect x="594" y="48" width="262" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="612" y="78" font-size="17" font-weight="700" fill="#e7ecf1">Corpus 2024 + 2026</text>
<text class="sans" x="612" y="101" font-size="13" fill="#a5b2bf">diff + deadline table (Art. 113)</text>
</g>
<g id="n_tool" class="fx"><rect x="908" y="48" width="252" height="100" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="926" y="78" font-size="17" font-weight="700" fill="#e7ecf1">6 MCP tools</text>
<text class="sans" x="926" y="101" font-size="13" fill="#a5b2bf">navigator · checker · search</text>
<text class="sans" x="926" y="121" font-size="13" fill="#a5b2bf">get · diff · verify</text>
</g>
<g id="n_sig" class="fx"><rect x="594" y="330" width="262" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="612" y="360" font-size="17" font-weight="700" fill="#e7ecf1">Signed release</text>
<text class="sans" x="612" y="383" font-size="13" fill="#a5b2bf">manifest · Ed25519</text>
</g>
<g id="n_evi" class="fx"><rect x="908" y="194" width="252" height="72" rx="12" fill="#1f2933" stroke="#46566a" stroke-width="1.5"/>
<text class="sans" x="926" y="224" font-size="17" font-weight="700" fill="#e7ecf1">Evidence record</text>
<text class="sans" x="926" y="247" font-size="13" fill="#a5b2bf">SHA-256 over canonical JSON</text>
</g>
<g id="n_ver" class="fx"><rect x="908" y="330" width="252" height="72" rx="12" fill="#17293f" stroke="#8cbcf2" stroke-width="2"/>
<text class="sans" x="926" y="360" font-size="17" font-weight="700" fill="#8cbcf2">Verify page</text>
<text class="sans" x="926" y="383" font-size="13" fill="#a5b2bf">recomputes in the browser</text>
</g>
<g id="cap" class="fx"><text class="mono" x="40" y="342" font-size="12" letter-spacing="1.4" fill="#8cbcf2">HOW IT WORKS</text><text class="sans" x="40" y="370" font-size="15" font-weight="600" fill="#e7ecf1">Built from the EUR-Lex text, then served read-only.</text><text class="sans" x="40" y="392" font-size="13" fill="#a5b2bf">Deterministic: no LLM at runtime, signed and hash-checked.</text></g>
