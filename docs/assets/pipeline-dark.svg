 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke6a{0%,30.42%{opacity:0}32.08%,100%{opacity:1}}#e6a{animation:ke6a 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kpe6{0%,57.50%{opacity:0}58.50%,62.75%{opacity:1}63.75%,100%{opacity:0}}#e6p{animation:kpe6 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke7{0%,28.33%{stroke-dashoffset:100}31.67%,100%{stroke-dashoffset:0}}#e7{animation:ke7 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke7a{0%,31.25%{opacity:0}32.92%,100%{opacity:1}}#e7a{animation:ke7a 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kpe7{0%,59.17%{opacity:0}60.17%,64.42%{opacity:1}65.42%,100%{opacity:0}}#e7p{animation:kpe7 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke8{0%,35.00%{stroke-dashoffset:100}38.33%,100%{stroke-dashoffset:0}}#e8{animation:ke8 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke8a{0%,37.92%{opacity:0}39.58%,100%{opacity:1}}#e8a{animation:ke8a 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kpe8{0%,62.50%{opacity:0}63.50%,67.75%{opacity:1}68.75%,100%{opacity:0}}#e8p{animation:kpe8 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kcap{0%,41.67%{opacity:0;transform:translateY(6px)}46.67%,100%{opacity:1;transform:translateY(0)}}#cap{animation:kcap 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kscene{0%,96.67%{opacity:1}100%{opacity:0}}#scene{animation:kscene 12s cubic-bezier(.4,0,.2,1) infinite both}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>

<defs>
<clipPath id="clip"><rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="14"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e7ecf1" stroke-width="1" opacity="0.05"/></pattern>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8cbcf2"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="14" fill="#171f28"/>
