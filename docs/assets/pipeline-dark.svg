<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">How the EU AI Act workbench works</title>
<desc id="d">Flow from EUR-Lex / CELLAR through the parser to the 2024 and 2026 corpus; the corpus and the obligations map feed the six MCP tools; signed releases and hash-sealed evidence records are recomputed by the verify page in the browser.</desc>
<style>.sans{font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.fx{transform-box:fill-box;transform-origin:center}.dash{stroke-dasharray:100 100;stroke-dashoffset:0}.pulse{opacity:0}@keyframes kn_eur{0%,1.67%{opacity:0;transform:translateY(10px)}5.83%,100%{opacity:1;transform:translateY(0)}}#n_eur{animation:kn_eur 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_par{0%,8.33%{opacity:0;transform:translateY(10px)}12.50%,100%{opacity:1;transform:translateY(0)}}#n_par{animation:kn_par 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_obl{0%,11.67%{opacity:0;transform:translateY(10px)}15.83%,100%{opacity:1;transform:translateY(0)}}#n_obl{animation:kn_obl 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_cor{0%,15.83%{opacity:0;transform:translateY(10px)}20.00%,100%{opacity:1;transform:translateY(0)}}#n_cor{animation:kn_cor 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_tool{0%,23.33%{opacity:0;transform:translateY(10px)}27.50%,100%{opacity:1;transform:translateY(0)}}#n_tool{animation:kn_tool 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_sig{0%,24.17%{opacity:0;transform:translateY(10px)}28.33%,100%{opacity:1;transform:translateY(0)}}#n_sig{animation:kn_sig 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_evi{0%,30.83%{opacity:0;transform:translateY(10px)}35.00%,100%{opacity:1;transform:translateY(0)}}#n_evi{animation:kn_evi 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kn_ver{0%,38.33%{opacity:0;transform:translateY(10px)}42.50%,100%{opacity:1;transform:translateY(0)}}#n_ver{animation:kn_ver 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke1{0%,5.83%{stroke-dashoffset:100}9.17%,100%{stroke-dashoffset:0}}#e1{animation:ke1 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframes ke1a{0%,8.75%{opacity:0}10.42%,100%{opacity:1}}#e1a{animation:ke1a 12s cubic-bezier(.4,0,.2,1) infinite both}@keyframe