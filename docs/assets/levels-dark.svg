<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Three separate verification answers</title>
<desc id="d">A quoted passage from Article 9(2) as of 2026-09-01 is checked by three independent gates: V0 wording gives exact match, V1 applicability gives not yet, applies from 2 December 2027, V2 language gives en, as requested. Three separate answers, never one combined verified.</desc>
<style>.sans{font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.fx{transform-box:fill-box;transform-origin:center}.dash{stroke-dasharray:100 100;stroke-dashoffset:0}@keyframes kqcard{0%,1.82%{opacity:0;transform:translateY(10px)}7.27%,100%{opacity:1;transform:translateY(0)}}#qcard{animation:kqcard 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes krow0{0%,5.45%{opacity:0;transform:translateY(8px)}10.00%,100%{opacity:1;transform:translateY(0)}}#row0{animation:krow0 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes krow1{0%,6.82%{opacity:0;transform:translateY(8px)}11.36%,100%{opacity:1;transform:translateY(0)}}#row1{animation:krow1 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes krow2{0%,8.18%{opacity:0;transform:translateY(8px)}12.73%,100%{opacity:1;transform:translateY(0)}}#row2{animation:krow2 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kscan{0%,12.73%{opacity:0;transform:translateX(0)}14.55%{opacity:1;transform:translateX(20px)}25.45%{opacity:1;transform:translateX(380px)}27.27%,100%{opacity:0;transform:translateX(400px)}}#scan{animation:kscan 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kqhl{0%,23.64%{opacity:0}27.27%,100%{opacity:1}}#qhl{animation:kqhl 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbr0{0%,29.09%{stroke-dashoffset:100}32.73%,100%{stroke-dashoffset:0}}#br0{animation:kbr0 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbd0{0%,32.27%{opacity:0}34.09%,100%{opacity:1}}#bd0{animation:kbd0 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kres0{0%,32.73%{opacity:0;transform:scale(.9)}36.36%,100%{opacity:1;transform:scale(1)}}#res0{animation:kres0 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes klst0{0%,35.45%{opacity:0;transform:translateY(4px)}40.00%,100%{opacity:1;transform:translateY(0)}}#lst0{animation:klst0 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbr1{0%,40.91%{stroke-dashoffset:100}44.55%,100%{stroke-dashoffset:0}}#br1{animation:kbr1 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbd1{0%,44.09%{opacity:0}45.91%,100%{opacity:1}}#bd1{animation:kbd1 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kres1{0%,44.55%{opacity:0;transform:scale(.9)}48.18%,100%{opacity:1;transform:scale(1)}}#res1{animation:kres1 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes klst1{0%,47.27%{opacity:0;transform:translateY(4px)}51.82%,100%{opacity:1;transform:translateY(0)}}#lst1{animation:klst1 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbr2{0%,52.73%{stroke-dashoffset:100}56.36%,100%{stroke-dashoffset:0}}#br2{animation:kbr2 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kbd2{0%,55.91%{opacity:0}57.73%,100%{opacity:1}}#bd2{animation:kbd2 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kres2{0%,56.36%{opacity:0;transform:scale(.9)}60.00%,100%{opacity:1;transform:scale(1)}}#res2{animation:kres2 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes klst2{0%,59.09%{opacity:0;transform:translateY(4px)}63.64%,100%{opacity:1;transform:translateY(0)}}#lst2{animation:klst2 11s cubic-bezier(.4,0,.2,1) infinite both}@keyframes kscene{0%,94.55%{opacity:1}100%{opacity:0}}#scene{animation:kscene 11s cubic-bezier(.4,0,.2,1) infinite both}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>

